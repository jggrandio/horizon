[project]
name = "horizon"
version = "0.1.0"
description = "Pluggable time-series forecasting: reusable core, swappable domains"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
baselines = [
    "lightgbm>=4.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pandas-stubs",
    "import-linter>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # builtins shadowing
    "C4",   # comprehensions
    "SIM",  # simplify
    "PTH",  # use pathlib
    "RUF",
]
ignore = ["E501"]  # line length is handled by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
disallow_any_generics = true
# Third-party packages without type information. Add here rather than
# scattering `# type: ignore` across the codebase.
[[tool.mypy.overrides]]
module = ["lightgbm.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "horizon"
# Needed to name third-party packages in forbidden_modules.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core does not know about domains"
type = "forbidden"
source_modules = [
    "horizon.data",
    "horizon.training",
    "horizon.inference",
    "horizon.backtesting",
]
forbidden_modules = ["horizon.domains"]

[[tool.importlinter.contracts]]
name = "The core imports no modelling framework"
type = "forbidden"
source_modules = [
    "horizon.data",
    "horizon.training",
    "horizon.inference",
    "horizon.backtesting",
]
forbidden_modules = ["torch", "lightgbm", "pytorch_forecasting"]

# Importing any core package runs horizon/__init__.py first, which the contracts above
# do not see. as_packages = false checks that one file, hence the explicit wildcard.
[[tool.importlinter.contracts]]
name = "The root package imports no domain or modelling framework"
type = "forbidden"
source_modules = ["horizon"]
forbidden_modules = [
    "horizon.domains",
    "horizon.domains.**",
    "torch",
    "lightgbm",
    "pytorch_forecasting",
]
as_packages = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
